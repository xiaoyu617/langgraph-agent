apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-agent
  labels:
    app: langgraph-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: langgraph-agent
  template:
    metadata:
      labels:
        app: langgraph-agent
    spec:
      containers:
      - name: agent
        image: langgraph-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: LLM_PROVIDER
          value: "mock"
        - name: EMBEDDING_PROVIDER
          value: "mock"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-agent-service
spec:
  type: NodePort
  selector:
    app: langgraph-agent
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
